<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-page="settingsPage">
    <div id="settings">
      <div id="ThemeCheckbox">
        <input type="radio" id="DarkModeRadio" name="theme" />
        <label for="DarkModeRadio">Dark Mode</label>

        <input type="radio" id="LightModeRadio" name="theme" />
        <label for="LightModeRadio">Light Mode</label>
      </div>
      <div id="ReducedColor">
        <input type="checkbox" id="ReducedColorCheckbox" />
        <label for="checkbox">Reduced Color</label>
      </div>
    </div>

    <button id="ApplyChanges">apply changes</button>
    <script type="module" src="../scripts/js/settings.js"></script>
    <script type="module" src="../scripts/js/theme.js"></script>
  </body>
</html>
